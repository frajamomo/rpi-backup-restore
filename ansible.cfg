[defaults]
inventory = inventory/
roles_path = roles
remote_tmp = /tmp/.ansible/tmp
host_key_checking = False
retry_files_enabled = False
stdout_callback = default
result_format = yaml
vault_password_file = ~/.vault_password

[privilege_escalation]
become = True
become_method = sudo
become_user = root

[ssh_connection]
pipelining = True
