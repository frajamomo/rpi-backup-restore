---
# NAS / CIFS mount
backup_dest_share: "{{ vault_backup_dest_share }}"
backup_credentials: "/home/{{ vault_user }}/.smbcredentials"
backup_mount_point: "/mnt/backup"
backup_mount_opts: "{{ vault_backup_mount_opts }},credentials={{ backup_credentials }}"
backup_base_dir: "{{ backup_mount_point }}/raspberrypi"

# Backup settings
backup_retention: 5
backup_stop_docker: true

# Encryption. Snapshots are stored as a single AES-256 archive: the tree
# contains the OpenVPN CA and client keys, SSH host keys, .smbcredentials and
# application tokens, and CIFS ignores chmod, so file modes cannot protect it.
# The passphrase is never stored -- both playbooks prompt for it.
backup_archive_suffix: ".tar.gz.gpg"
backup_archive: "{{ backup_base_dir }}/{{ backup_timestamp }}{{ backup_archive_suffix }}"
backup_passphrase_file: "/root/.backup-passphrase.tmp"
backup_compress_threads: 4

# Source directories
backup_stacks_dir: "/opt/stacks"
# System config files/dirs to back up (rsync --relative preserves paths)
backup_system_paths:
  - /etc/openvpn
  - /etc/ssh/sshd_config
  - /etc/ssh/ssh_host_*_key
  - /etc/ssh/ssh_host_*_key.pub
  - /etc/sysctl.d
  - /etc/sysctl.conf
  - /etc/iptables
  - /etc/fail2ban
  - /etc/audit
  - /etc/aide
  - /etc/fstab
  - /boot/firmware/cmdline.txt
  - /etc/systemd/system/docker-compose-*.service
  - /etc/systemd/system/aide-check.*
  - /etc/systemd/system/synology-mount.service
  - /etc/systemd/system/synology-mount.timer
  - /usr/local/bin/synology-mount-monitor.sh
  - /etc/profile.d/hardening.sh
  - /etc/security/limits.d
  - /etc/modprobe.d
  - /etc/default/grub
  - /etc/cron.d

# User home files to back up
backup_user_home: "/home/{{ vault_user }}"
backup_user_files:
  - .smbcredentials
  - .ssh/authorized_keys

# Restore settings
restore_snapshot: "latest"
restore_install_packages: true

# Packages to install on a fresh OS during restore
restore_packages:
  - docker.io
  - docker-compose
  - openvpn
  - fail2ban
  - auditd
  - audispd-plugins
  - aide
  - iptables-persistent
  - netfilter-persistent
  - cifs-utils
  - rsync
  - curl
  - jq

# Docker compose systemd units (managed by systemd — docker-compose down removes containers)
docker_compose_units: "{{ vault_docker_compose_units }}"

# Standalone Docker containers (managed by Docker restart policy, no systemd unit)
docker_standalone_containers: "{{ vault_docker_standalone_containers }}"

# Where the archive is decrypted during a restore. Local disk, not the NAS:
# the decrypted tree contains every secret on the host and is removed when
# the play finishes.
restore_staging_dir: "/var/tmp/rpi-restore-staging"
