---
- name: Record restore start time
  ansible.builtin.set_fact:
    restore_start: "{{ now(utc=false) }}"

# Mount NAS share
- name: Create mount point
  ansible.builtin.file:
    path: "{{ backup_mount_point }}"
    state: directory
    mode: "0755"

- name: Mount NAS backup share
  ansible.posix.mount:
    src: "{{ backup_dest_share }}"
    path: "{{ backup_mount_point }}"
    fstype: cifs
    opts: "{{ backup_mount_opts }}"
    state: ephemeral

- name: Run restore
  block:
    # Resolve snapshot path
    - name: Read latest marker file
      ansible.builtin.slurp:
        src: "{{ backup_base_dir }}/latest"
      register: latest_marker
      when: restore_snapshot == "latest"

    - name: Set snapshot name from marker
      ansible.builtin.set_fact:
        restore_snapshot_resolved: "{{ (latest_marker.content | b64decode | trim) if restore_snapshot == 'latest' else restore_snapshot }}"

    - name: Look for an encrypted archive
      ansible.builtin.stat:
        path: "{{ backup_base_dir }}/{{ restore_snapshot_resolved }}{{ backup_archive_suffix }}"
      register: archive_stat

    # Snapshots written before encryption was introduced are plain
    # directories; still restorable, just unprotected on the NAS.
    - name: Look for a legacy unencrypted snapshot directory
      ansible.builtin.stat:
        path: "{{ backup_base_dir }}/{{ restore_snapshot_resolved }}"
      register: snapshot_stat

    - name: Fail if the snapshot does not exist in either form
      ansible.builtin.fail:
        msg: >-
          Snapshot '{{ restore_snapshot_resolved }}' not found under
          {{ backup_base_dir }} as either
          {{ restore_snapshot_resolved }}{{ backup_archive_suffix }} or a
          directory.
      when: not archive_stat.stat.exists and not snapshot_stat.stat.exists

    - name: Decrypt and extract the archive
      when: archive_stat.stat.exists
      block:
        - name: Create a staging directory for the decrypted snapshot
          ansible.builtin.file:
            path: "{{ restore_staging_dir }}"
            state: directory
            owner: root
            group: root
            mode: "0700"

        - name: Write the passphrase to a temporary file
          ansible.builtin.copy:
            content: "{{ backup_passphrase }}"
            dest: "{{ backup_passphrase_file }}"
            mode: "0600"
          no_log: true

        # Fails cleanly on a wrong passphrase, before anything on the host
        # has been modified.
        - name: Decrypt and unpack
          ansible.builtin.shell: |
            set -o pipefail
            gpg --batch --quiet --decrypt \
                --passphrase-file "{{ backup_passphrase_file }}" \
                "{{ backup_base_dir }}/{{ restore_snapshot_resolved }}{{ backup_archive_suffix }}" \
              | tar -C "{{ restore_staging_dir }}" -xzf -
          args:
            executable: /bin/bash
          changed_when: true

    - name: Set resolved snapshot path
      ansible.builtin.set_fact:
        snapshot_path: >-
          {{ restore_staging_dir if archive_stat.stat.exists
             else backup_base_dir ~ '/' ~ restore_snapshot_resolved }}

    - name: Display snapshot being restored
      ansible.builtin.debug:
        msg: "Restoring from snapshot: {{ snapshot_path }}"

    # Dispatch to sub-tasks
    - name: Install packages on fresh OS
      ansible.builtin.include_tasks: packages.yml
      tags: [packages]
      when: restore_install_packages | bool

    - name: Restore system configuration
      ansible.builtin.include_tasks: system_config.yml
      tags: [system_config]

    - name: Restore Docker stacks
      ansible.builtin.include_tasks: docker_stacks.yml
      tags: [docker_stacks]

    - name: Restore OpenVPN configuration
      ansible.builtin.include_tasks: openvpn.yml
      tags: [openvpn]

    - name: Restart and enable services
      ansible.builtin.include_tasks: services.yml
      tags: [services]

    - name: Verify restore
      ansible.builtin.include_tasks: verify.yml
      tags: [verify]

  always:
    # The staging tree holds the decrypted secrets, so it must not outlive
    # the run, successful or not.
    - name: Remove the decrypted staging directory
      ansible.builtin.file:
        path: "{{ restore_staging_dir }}"
        state: absent

    - name: Remove the temporary passphrase file
      ansible.builtin.file:
        path: "{{ backup_passphrase_file }}"
        state: absent

    # Unmount and report
    - name: Unmount NAS backup share
      ansible.posix.mount:
        path: "{{ backup_mount_point }}"
        state: unmounted

    - name: Record restore end time
      ansible.builtin.set_fact:
        restore_end: "{{ now(utc=false) }}"

    - name: Display restore report
      ansible.builtin.debug:
        msg: |
          ========== RESTORE REPORT ==========
          Snapshot:   {{ snapshot_path | default('unknown') }}
          Started:    {{ restore_start }}
          Finished:   {{ restore_end }}
          --------- Next Steps ---------------
          1. Run bastion-hardening playbook to re-apply security policies
          2. Regenerate AIDE database: aide --init
          3. Verify OpenVPN clients can connect
          4. Verify all Docker containers are healthy
          ======================================
